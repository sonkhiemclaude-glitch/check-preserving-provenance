[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provpub"
version = "0.2.0"
description = "Privacy-preserving release of agentic pipeline provenance with verdict-equivalence guarantees"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "TO BE CHOSEN BY THE AUTHORS"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.8", "types-PyYAML"]
validation = ["pm4py>=2.7", "prov>=2.0"]

[project.scripts]
provpub = "provpub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E702", "E731", "B008", "B905", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# long literal lines kept as in the code that produced the reference results
"src/provpub/data/prov_io.py" = ["E501"]
"src/provpub/data/synthetic.py" = ["E501"]
"src/provpub/experiments/tables.py" = ["E501"]
"src/provpub/methods/operators.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["provpub"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
